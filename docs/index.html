<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0d0a14;
            --bg-secondary: #161222;
            --bg-card: #1e1a2e;
            --accent: #9966ff;
            --accent-light: #b388ff;
            --gold: #d9a634;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --rarity-common: #b0b0b0;
            --rarity-uncommon: #99c2d6;
            --rarity-rare: #d9b34a;
            --rarity-mythic: #e65c33;
            --success: #4ade80;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* iPhone Frame */
        .phone-frame {
            max-width: 430px;
            margin: 20px auto;
            background: var(--bg-primary);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 500px) {
            body {
                background: #000;
                padding: 20px;
            }
            .phone-frame {
                border-radius: 50px;
                border: 8px solid #2a2a2a;
                min-height: 90vh;
                max-height: 900px;
                box-shadow: 0 0 60px rgba(153, 102, 255, 0.2);
            }
        }

        /* Header */
        .header {
            padding: 60px 20px 20px;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .stat-value svg {
            width: 14px;
            height: 14px;
            fill: var(--accent);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Search Bar */
        .search-container {
            padding: 12px 16px;
            display: flex;
            gap: 10px;
        }

        .search-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 16px;
            gap: 10px;
        }

        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--text-secondary);
        }

        .search-bar svg {
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
        }

        .icon-btn {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: var(--text-secondary);
        }

        .icon-btn.accent svg {
            fill: var(--accent);
        }

        /* Tabs */
        .tabs {
            display: flex;
            padding: 0 16px;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--accent);
            color: white;
        }

        /* Card List */
        .card-list {
            padding: 0 16px 100px;
            overflow-y: auto;
            max-height: calc(100vh - 280px);
        }

        .card-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .card-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        .card-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .card-image {
            width: 60px;
            height: 84px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card-image.common { box-shadow: 0 0 15px rgba(176, 176, 176, 0.3); }
        .card-image.uncommon { box-shadow: 0 0 15px rgba(153, 194, 214, 0.4); }
        .card-image.rare { box-shadow: 0 0 15px rgba(217, 179, 74, 0.5); }
        .card-image.mythic { box-shadow: 0 0 20px rgba(230, 92, 51, 0.6); }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .foil-icon {
            color: var(--gold);
            font-size: 12px;
        }

        .card-set {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .rarity-badge {
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: capitalize;
        }

        .rarity-badge.common { background: rgba(176,176,176,0.2); color: var(--rarity-common); }
        .rarity-badge.uncommon { background: rgba(153,194,214,0.2); color: var(--rarity-uncommon); }
        .rarity-badge.rare { background: rgba(217,179,74,0.2); color: var(--rarity-rare); }
        .rarity-badge.mythic { background: rgba(230,92,51,0.2); color: var(--rarity-mythic); }

        .card-price {
            font-size: 12px;
            font-weight: 600;
            color: var(--success);
        }

        .quantity-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .quantity {
            font-size: 18px;
            font-weight: 700;
        }

        .qty-buttons {
            display: flex;
            gap: 6px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .qty-btn.minus {
            background: rgba(255,255,255,0.1);
            color: var(--text-secondary);
        }

        .qty-btn.plus {
            background: var(--accent);
            color: white;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 40px;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--accent), #6633cc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .empty-state h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--accent), #7744dd);
            border: none;
            color: white;
            padding: 14px 28px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .primary-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(153, 102, 255, 0.4);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        /* Full Screen Card View */
        .fullscreen-card {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 200;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .fullscreen-card.active {
            display: flex;
        }

        .fullscreen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 50px 20px 16px;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-image-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .fullscreen-image-container::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }

        .fullscreen-image-container.common::before { background: var(--rarity-common); }
        .fullscreen-image-container.uncommon::before { background: var(--rarity-uncommon); }
        .fullscreen-image-container.rare::before { background: var(--rarity-rare); }
        .fullscreen-image-container.mythic::before { background: var(--rarity-mythic); }

        .fullscreen-image {
            max-width: 280px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }

        .fullscreen-info {
            background: var(--bg-secondary);
            border-radius: 24px 24px 0 0;
            padding: 24px 20px 40px;
        }

        .fullscreen-title {
            text-align: center;
            margin-bottom: 16px;
        }

        .fullscreen-title h2 {
            font-size: 22px;
            font-weight: 700;
        }

        .fullscreen-title .set-name {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .badges-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .foil-badge {
            background: linear-gradient(135deg, #d4a84b, #8b6914);
            color: white;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Price Section */
        .prices-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .prices-section h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .price-row {
            display: flex;
            align-items: center;
            padding: 14px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .price-row:last-child {
            margin-bottom: 0;
        }

        .platform-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
        }

        .platform-icon.tcg { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .platform-icon.cardmarket { background: rgba(234, 179, 8, 0.2); color: #eab308; }
        .platform-icon.cardhoarder { background: rgba(168, 85, 247, 0.2); color: #a855f7; }

        .platform-info {
            flex: 1;
        }

        .platform-name {
            font-weight: 600;
            font-size: 14px;
        }

        .platform-currency {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .platform-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--success);
        }

        .platform-price.na {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .buy-link {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            margin-left: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            text-decoration: none;
        }

        /* Quantity in fullscreen */
        .quantity-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 16px;
        }

        .qty-btn-lg {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .qty-btn-lg.minus {
            background: rgba(255,255,255,0.1);
            color: var(--text-secondary);
        }

        .qty-btn-lg.plus {
            background: var(--accent);
            color: white;
        }

        .quantity-display {
            text-align: center;
        }

        .quantity-display .qty-value {
            font-size: 32px;
            font-weight: 800;
        }

        .quantity-display .qty-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Search Modal */
        .search-modal {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 300;
            display: none;
            flex-direction: column;
        }

        .search-modal.active {
            display: flex;
        }

        .search-modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 50px 16px 16px;
            background: var(--bg-secondary);
        }

        .search-modal-header .search-bar {
            flex: 1;
        }

        .cancel-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 15px;
            cursor: pointer;
        }

        .search-results {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-result-item:hover {
            background: var(--bg-secondary);
        }

        .search-result-item img {
            width: 50px;
            height: 70px;
            border-radius: 6px;
            object-fit: cover;
        }

        .search-result-info {
            flex: 1;
            min-width: 0;
        }

        .search-result-info h4 {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-result-info p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .add-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        /* Sort Tabs */
        .sort-tabs {
            display: flex;
            gap: 8px;
            padding: 8px 16px 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .sort-tabs::-webkit-scrollbar {
            display: none;
        }

        .sort-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .sort-tab:hover {
            background: rgba(255,255,255,0.1);
        }

        .sort-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .sort-tab svg {
            opacity: 0.8;
        }

        /* Set Header */
        .set-header {
            padding: 12px 4px 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(153, 102, 255, 0.2);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .set-header::before {
            content: '';
            width: 4px;
            height: 16px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* Search Tips */
        .search-tips {
            text-align: center;
            padding: 40px 30px;
        }

        .search-tips svg {
            width: 60px;
            height: 60px;
            fill: var(--accent);
            margin-bottom: 20px;
        }

        .search-tips h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .search-tips p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .tip-list {
            text-align: left;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
        }

        .tip-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .tip-item:last-child {
            border-bottom: none;
        }

        .tip-item svg {
            width: 20px;
            height: 20px;
            fill: var(--accent);
        }

        .tip-item span {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: #000;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 400;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Launch Screen */
        .launch-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a0f2e, #0d0a14);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .launch-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .launch-logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--accent), #6633cc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(153, 102, 255, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        .launch-logo svg {
            width: 50px;
            height: 50px;
            fill: white;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(153, 102, 255, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 80px rgba(153, 102, 255, 0.7); }
        }

        .launch-title {
            margin-top: 24px;
            font-size: 24px;
            font-weight: 700;
        }

        .launch-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 8px;
        }

        /* Particles */
        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(-100px); opacity: 0.1; }
        }
    </style>
</head>
<body>
    <!-- Launch Screen -->
    <div class="launch-screen" id="launchScreen">
        <div class="particles" id="particles"></div>
        <div class="launch-logo">
            <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/></svg>
        </div>
        <div class="launch-title">Magic Collection</div>
        <div class="launch-subtitle">Track your cards</div>
    </div>

    <!-- Main App -->
    <div class="phone-frame">
        <!-- Header -->
        <div class="header">
            <h1>My Collection</h1>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value">
                    <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/></svg>
                    <span id="totalCards">0</span>
                </div>
                <div class="stat-label">Cards</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">
                    <svg viewBox="0 0 24 24"><path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/></svg>
                    <span id="uniqueCards">0</span>
                </div>
                <div class="stat-label">Unique</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm0-4h-2V7h2v8z"/></svg>
                    <span id="totalValue">$0.00</span>
                </div>
                <div class="stat-label">Value</div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-bar" onclick="openSearchModal()">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" placeholder="Search your collection..." readonly>
            </div>
            <button class="icon-btn accent" onclick="openSearchModal()">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
        </div>

        <!-- Sort Tabs -->
        <div class="sort-tabs">
            <button class="sort-tab active" data-sort="setName" onclick="handleSort('setName')">
                <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4z"/></svg>
                Extension
            </button>
            <button class="sort-tab" data-sort="name" onclick="handleSort('name')">
                <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M2.5 4v3h5v12h3V7h5V4h-13zm19 5h-9v3h3v7h3v-7h3V9z"/></svg>
                Nom
            </button>
            <button class="sort-tab" data-sort="price" onclick="handleSort('price')">
                <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm0-4h-2V7h2v8z"/></svg>
                Prix
            </button>
            <button class="sort-tab" data-sort="rarity" onclick="handleSort('rarity')">
                <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/></svg>
                Rareté
            </button>
        </div>

        <!-- Card List -->
        <div class="card-list" id="cardList">
            <!-- Cards will be rendered here -->
        </div>
    </div>

    <!-- Full Screen Card View -->
    <div class="fullscreen-card" id="fullscreenCard">
        <div class="fullscreen-header">
            <button class="close-btn" onclick="closeFullscreen()">✕</button>
            <div class="badges-row" id="fullscreenBadges"></div>
        </div>
        <div class="fullscreen-image-container" id="imageContainer">
            <img class="fullscreen-image" id="fullscreenImage" src="" alt="">
        </div>
        <div class="fullscreen-info">
            <div class="fullscreen-title">
                <h2 id="fullscreenName"></h2>
                <p class="set-name" id="fullscreenSet"></p>
            </div>

            <div class="prices-section">
                <h3>Market Prices</h3>
                <div id="pricesList"></div>
            </div>

            <div class="quantity-section">
                <button class="qty-btn-lg minus" onclick="updateFullscreenQty(-1)">−</button>
                <div class="quantity-display">
                    <div class="qty-value" id="fullscreenQty">1</div>
                    <div class="qty-label">in collection</div>
                </div>
                <button class="qty-btn-lg plus" onclick="updateFullscreenQty(1)">+</button>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div class="search-modal" id="searchModal">
        <div class="search-modal-header">
            <div class="search-bar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Search cards..." oninput="handleSearch(this.value)">
            </div>
            <button class="cancel-btn" onclick="closeSearchModal()">Cancel</button>
        </div>
        <div class="search-results" id="searchResults">
            <div class="search-tips">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <h3>Search for Cards</h3>
                <p>Find cards by name, set, or type</p>
                <div class="tip-list">
                    <div class="tip-item">
                        <svg viewBox="0 0 24 24"><path d="M2.5 4v3h5v12h3V7h5V4h-13zm19 5h-9v3h3v7h3v-7h3V9z"/></svg>
                        <span>Search by card name</span>
                    </div>
                    <div class="tip-item">
                        <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/></svg>
                        <span>Use set: to filter by set</span>
                    </div>
                    <div class="tip-item">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
                        <span>Use c: for color (w, u, b, r, g)</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">Card added to collection!</div>

    <script>
        // Default cards - will be loaded from Scryfall API
        const defaultCardNames = [
            { name: "Llanowar Elves", set: "fdn", quantity: 4, isFoil: false },
            { name: "Counterspell", set: "fdn", quantity: 2, isFoil: false },
            { name: "Overlord of the Balemurk", set: "dsk", quantity: 1, isFoil: true },
            { name: "Fear of Missing Out", set: "dsk", quantity: 3, isFoil: false },
            { name: "Mabel, Heir to Cragflame", set: "blb", quantity: 1, isFoil: false },
            { name: "Moonrise Cleric", set: "blb", quantity: 2, isFoil: false },
            { name: "Flare of Denial", set: "mh3", quantity: 2, isFoil: false },
            { name: "Nadu, Winged Wisdom", set: "mh3", quantity: 4, isFoil: false },
            { name: "Simulacrum Synthesizer", set: "mkm", quantity: 4, isFoil: false },
            { name: "Leyline of the Guildpact", set: "mkm", quantity: 4, isFoil: false }
        ];

        // Load card from Scryfall API
        async function loadCardFromScryfall(cardInfo) {
            const query = cardInfo.set
                ? `!"${cardInfo.name}" set:${cardInfo.set}`
                : `!"${cardInfo.name}"`;

            try {
                const response = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(query)}&unique=prints`);
                const data = await response.json();

                if (data.data && data.data.length > 0) {
                    const card = data.data[0];
                    const imageUrl = card.image_uris?.small || card.card_faces?.[0]?.image_uris?.small || '';
                    const imageLarge = card.image_uris?.large || card.card_faces?.[0]?.image_uris?.large || '';

                    return {
                        id: card.id,
                        name: card.name,
                        setName: card.set_name,
                        setCode: card.set,
                        rarity: card.rarity,
                        image: imageUrl,
                        imageLarge: imageLarge,
                        price: card.prices?.usd || null,
                        prices: {
                            usd: card.prices?.usd,
                            usdFoil: card.prices?.usd_foil,
                            eur: card.prices?.eur,
                            eurFoil: card.prices?.eur_foil,
                            tix: card.prices?.tix
                        },
                        purchaseUris: card.purchase_uris,
                        quantity: cardInfo.quantity,
                        isFoil: cardInfo.isFoil
                    };
                }
            } catch (error) {
                console.error(`Failed to load ${cardInfo.name}:`, error);
            }
            return null;
        }

        // Load all default cards from API
        async function loadDefaultCards() {
            showToast('Loading cards from Scryfall...');
            const cards = [];

            for (const cardInfo of defaultCardNames) {
                const card = await loadCardFromScryfall(cardInfo);
                if (card) {
                    cards.push(card);
                }
                // Small delay to respect rate limits
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            return cards;
        }

        // Collection data
        let collection = JSON.parse(localStorage.getItem('magicCollection')) || [];
        let currentCard = null;
        let searchTimeout = null;
        let currentSort = 'setName'; // Default sort by set

        // Initialize with default cards if empty
        async function initializeCollection() {
            if (collection.length === 0) {
                // Load cards from Scryfall API
                collection = await loadDefaultCards();
                saveCollection();
                showToast('Collection loaded!');
            }
            sortCollection('setName');
        }

        // Sort collection
        function sortCollection(sortBy) {
            currentSort = sortBy;
            switch(sortBy) {
                case 'setName':
                    collection.sort((a, b) => {
                        const setCompare = (a.setName || '').localeCompare(b.setName || '');
                        if (setCompare !== 0) return setCompare;
                        return (a.name || '').localeCompare(b.name || '');
                    });
                    break;
                case 'name':
                    collection.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                    break;
                case 'price':
                    collection.sort((a, b) => (parseFloat(b.price) || 0) - (parseFloat(a.price) || 0));
                    break;
                case 'rarity':
                    const rarityOrder = { mythic: 0, rare: 1, uncommon: 2, common: 3 };
                    collection.sort((a, b) => (rarityOrder[a.rarity] || 4) - (rarityOrder[b.rarity] || 4));
                    break;
            }
            renderCollection();
        }

        // Handle sort button click
        function handleSort(sortBy) {
            // Update active tab
            document.querySelectorAll('.sort-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.sort === sortBy) {
                    tab.classList.add('active');
                }
            });
            sortCollection(sortBy);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Create particles
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 4 + 's';
                particlesContainer.appendChild(particle);
            }

            // Hide launch screen
            setTimeout(() => {
                document.getElementById('launchScreen').classList.add('hidden');
            }, 2000);

            // Initialize collection (async)
            initializeCollection();
        });

        // Render collection
        function renderCollection() {
            const cardList = document.getElementById('cardList');
            const totalCards = document.getElementById('totalCards');
            const uniqueCards = document.getElementById('uniqueCards');
            const totalValue = document.getElementById('totalValue');

            if (collection.length === 0) {
                cardList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/></svg>
                        </div>
                        <h2>Your Collection is Empty</h2>
                        <p>Start adding cards to track your Magic: The Gathering collection</p>
                        <button class="primary-btn" onclick="openSearchModal()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                            Add Your First Card
                        </button>
                    </div>
                `;
            } else {
                let html = '';
                let currentSet = '';

                collection.forEach((card, index) => {
                    const rarity = card.rarity || 'common';

                    // Add set header when sorting by set
                    if (currentSort === 'setName' && card.setName !== currentSet) {
                        currentSet = card.setName;
                        html += `<div class="set-header">${card.setName}</div>`;
                    }

                    html += `
                        <div class="card-item" onclick="openFullscreen(${index})">
                            <img class="card-image ${rarity}" src="${card.image}" alt="${card.name}">
                            <div class="card-info">
                                <div class="card-name">
                                    ${card.name}
                                    ${card.isFoil ? '<span class="foil-icon">✨</span>' : ''}
                                </div>
                                <div class="card-set">${card.setName}</div>
                                <div class="card-meta">
                                    <span class="rarity-badge ${rarity}">${rarity}</span>
                                    ${card.price ? `<span class="card-price">$${card.price}</span>` : ''}
                                </div>
                            </div>
                            <div class="quantity-controls" onclick="event.stopPropagation()">
                                <span class="quantity">×${card.quantity}</span>
                                <div class="qty-buttons">
                                    <button class="qty-btn minus" onclick="updateQuantity(${index}, -1)">−</button>
                                    <button class="qty-btn plus" onclick="updateQuantity(${index}, 1)">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                cardList.innerHTML = html;
            }

            // Update stats
            const total = collection.reduce((sum, card) => sum + card.quantity, 0);
            const unique = collection.length;
            const value = collection.reduce((sum, card) => {
                const price = parseFloat(card.price) || 0;
                return sum + (price * card.quantity);
            }, 0);

            totalCards.textContent = total;
            uniqueCards.textContent = unique;
            totalValue.textContent = '$' + value.toFixed(2);
        }

        // Update quantity
        function updateQuantity(index, delta) {
            collection[index].quantity += delta;
            if (collection[index].quantity <= 0) {
                collection.splice(index, 1);
            }
            saveCollection();
            renderCollection();
        }

        // Save collection
        function saveCollection() {
            localStorage.setItem('magicCollection', JSON.stringify(collection));
        }

        // Open fullscreen view
        function openFullscreen(index) {
            currentCard = { ...collection[index], index };
            const card = currentCard;

            document.getElementById('fullscreenImage').src = card.imageLarge || card.image;
            document.getElementById('fullscreenName').textContent = card.name;
            document.getElementById('fullscreenSet').textContent = card.setName;
            document.getElementById('fullscreenQty').textContent = card.quantity;

            const imageContainer = document.getElementById('imageContainer');
            imageContainer.className = 'fullscreen-image-container ' + (card.rarity || 'common');

            // Badges
            let badgesHtml = `<span class="rarity-badge ${card.rarity}">${card.rarity}</span>`;
            if (card.isFoil) {
                badgesHtml += '<span class="foil-badge">✨ Foil</span>';
            }
            document.getElementById('fullscreenBadges').innerHTML = badgesHtml;

            // Prices
            const prices = card.prices || {};
            document.getElementById('pricesList').innerHTML = `
                <div class="price-row">
                    <div class="platform-icon tcg">$</div>
                    <div class="platform-info">
                        <div class="platform-name">TCGPlayer</div>
                        <div class="platform-currency">USD</div>
                    </div>
                    <div class="platform-price ${prices.usd ? '' : 'na'}">${prices.usd ? '$' + prices.usd : 'N/A'}</div>
                    ${prices.usd ? '<a href="' + (card.purchaseUris?.tcgplayer || '#') + '" target="_blank" class="buy-link">↗</a>' : ''}
                </div>
                <div class="price-row">
                    <div class="platform-icon cardmarket">€</div>
                    <div class="platform-info">
                        <div class="platform-name">Cardmarket</div>
                        <div class="platform-currency">EUR</div>
                    </div>
                    <div class="platform-price ${prices.eur ? '' : 'na'}">${prices.eur ? '€' + prices.eur : 'N/A'}</div>
                    ${prices.eur ? '<a href="' + (card.purchaseUris?.cardmarket || '#') + '" target="_blank" class="buy-link">↗</a>' : ''}
                </div>
                <div class="price-row">
                    <div class="platform-icon cardhoarder">T</div>
                    <div class="platform-info">
                        <div class="platform-name">Cardhoarder</div>
                        <div class="platform-currency">TIX</div>
                    </div>
                    <div class="platform-price ${prices.tix ? '' : 'na'}">${prices.tix ? prices.tix + ' TIX' : 'N/A'}</div>
                    ${prices.tix ? '<a href="' + (card.purchaseUris?.cardhoarder || '#') + '" target="_blank" class="buy-link">↗</a>' : ''}
                </div>
            `;

            document.getElementById('fullscreenCard').classList.add('active');
        }

        // Close fullscreen
        function closeFullscreen() {
            document.getElementById('fullscreenCard').classList.remove('active');
            currentCard = null;
        }

        // Update fullscreen quantity
        function updateFullscreenQty(delta) {
            if (!currentCard) return;
            const newQty = currentCard.quantity + delta;
            if (newQty <= 0) {
                collection.splice(currentCard.index, 1);
                saveCollection();
                renderCollection();
                closeFullscreen();
            } else {
                collection[currentCard.index].quantity = newQty;
                currentCard.quantity = newQty;
                document.getElementById('fullscreenQty').textContent = newQty;
                saveCollection();
                renderCollection();
            }
        }

        // Open search modal
        function openSearchModal() {
            document.getElementById('searchModal').classList.add('active');
            document.getElementById('searchInput').focus();
        }

        // Close search modal
        function closeSearchModal() {
            document.getElementById('searchModal').classList.remove('active');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = `
                <div class="search-tips">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <h3>Search for Cards</h3>
                    <p>Find cards by name, set, or type</p>
                </div>
            `;
        }

        // Handle search
        function handleSearch(query) {
            clearTimeout(searchTimeout);
            if (query.length < 2) return;

            document.getElementById('searchResults').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Searching...</p>
                </div>
            `;

            searchTimeout = setTimeout(() => {
                fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.data && data.data.length > 0) {
                            let html = '';
                            data.data.slice(0, 20).forEach(card => {
                                const imageUrl = card.image_uris?.small || card.card_faces?.[0]?.image_uris?.small || '';
                                html += `
                                    <div class="search-result-item" onclick='addCard(${JSON.stringify({
                                        id: card.id,
                                        name: card.name,
                                        setName: card.set_name,
                                        rarity: card.rarity,
                                        image: imageUrl,
                                        imageLarge: card.image_uris?.large || card.card_faces?.[0]?.image_uris?.large || '',
                                        price: card.prices?.usd,
                                        prices: {
                                            usd: card.prices?.usd,
                                            usdFoil: card.prices?.usd_foil,
                                            eur: card.prices?.eur,
                                            eurFoil: card.prices?.eur_foil,
                                            tix: card.prices?.tix
                                        },
                                        purchaseUris: card.purchase_uris
                                    }).replace(/'/g, "\\'")})'>
                                        <img src="${imageUrl}" alt="${card.name}">
                                        <div class="search-result-info">
                                            <h4>${card.name}</h4>
                                            <p>${card.set_name} • <span class="rarity-badge ${card.rarity}">${card.rarity}</span></p>
                                        </div>
                                        <button class="add-btn">+</button>
                                    </div>
                                `;
                            });
                            document.getElementById('searchResults').innerHTML = html;
                        } else {
                            document.getElementById('searchResults').innerHTML = `
                                <div class="search-tips">
                                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                                    <h3>No cards found</h3>
                                    <p>Try a different search term</p>
                                </div>
                            `;
                        }
                    })
                    .catch(err => {
                        document.getElementById('searchResults').innerHTML = `
                            <div class="search-tips">
                                <h3>Error</h3>
                                <p>Failed to search. Please try again.</p>
                            </div>
                        `;
                    });
            }, 300);
        }

        // Add card to collection
        function addCard(card) {
            const existingIndex = collection.findIndex(c => c.id === card.id && c.isFoil === card.isFoil);
            if (existingIndex >= 0) {
                collection[existingIndex].quantity += 1;
            } else {
                collection.push({
                    ...card,
                    quantity: 1,
                    isFoil: false,
                    dateAdded: new Date().toISOString()
                });
            }
            saveCollection();
            renderCollection();
            closeSearchModal();
            showToast('Card added to collection!');
        }

        // Show toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
